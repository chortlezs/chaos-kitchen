<body>

<section class="panel">

</section>

  if(p.done)return;
  p.toss=now;
  if(p.flipWindow>0){p.flips++;p.flipWindow=0;p.checkpoint++;burst(468,246,now,c.yellow,25);toast("PERFECT · 翻面命中",c.yellow,.72);}
  else {p.burn+=13;toast("时机错误 · 焦糊上升",c.red,.72);}
}
function cook(dt){
  const p=state.phase;
  if(p.flipWindow>0){
    p.flipWindow-=dt;
    if(p.flipWindow<=0){p.checkpoint++;p.burn+=42;toast("错过翻面 · 焦糊上升",c.red,1.1);}
  }else if(keys.has("e")){
    p.progress+=dt/7.7;
    const limit=[.34,.72][p.checkpoint];
    if(limit!==undefined&&p.progress>=limit){p.progress=limit;p.flipWindow=2.8;}
  }else p.burn+=dt*13;
  if(p.progress>=1&&p.flips<2)p.burn+=dt*25;
  if(p.burn>=100)conclude(false,"焦糊报废 · 重新取料");
  else if(p.progress>=1&&p.flips===2)conclude(true,p.burn<15?"EXCELLENT · 工件重组完成":"GOOD · 工件重组完成");
}
function balance(dt){
  const p=state.phase;
  p.elapsed+=dt;p.surge=Math.max(0,p.surge-dt);
  const input=+(keys.has("d")||keys.has("arrowright"))-+(keys.has("a")||keys.has("arrowleft"));
  const shock=Math.sin(p.elapsed*3.25)*.92+Math.cos(p.elapsed*7)*.42+.23;
  if(p.elapsed>=p.nextSurge){
    p.vel+=(Math.sin(p.elapsed*2.61)>0?1:-1)*.92;p.surge=.27;p.nextSurge+=1.45+Math.random()*.48;
    burst(330,335,now,c.pink,10);burst(630,335,now,c.light,10);
  }
  p.vel+=(input*4+shock-p.tilt*.74)*dt;
  p.vel*=Math.exp(-2.4*dt);
  p.tilt=clamp(p.tilt+p.vel*dt,-1,1);
  if(p.route<1&&keys.has("e"))p.route=Math.min(1,p.route+dt*(.198-Math.abs(p.tilt)*.048));
  if(Math.abs(p.tilt)>.54)p.integrity-=dt*(17+Math.abs(p.tilt)*12);
  const centered=Math.abs(p.tilt)<.19&&!keys.has("e");
  if(p.route>=1)p.stable=centered?p.stable+dt:0;
  if(p.integrity<=0)conclude(false,"食材洒落 · 重新取料");
  else if(p.stable>=1.2)conclude(true,p.integrity>=90?"EXCELLENT · 稳盘送达":"GOOD · 已出餐");
}
function advance(dt){
  if(state.open)return;
  if(!state.practice){
    state.time-=dt;
    for(const order of state.queue)order.left-=dt;
    if(state.time<=0){state.time=0;state.failed+=state.queue.length;toggleMenu("end");return;}
    if(state.queue[0]?.left<=0&&!state.phase?.done){
      state.queue.shift();state.failed++;state.held=null;backToMap();
      toast("订单超时",c.red);
      if(!state.queue.length)toggleMenu("end");
      return;
    }
  }
  if(state.view==="map"){move(dt);return;}
  const p=state.phase;
  if(p.done){p.done.backIn-=dt;if(p.done.backIn<=0)returnFromPhase();return;}
  p.left=Math.max(0,p.left-dt);
  if(p.left===0){conclude(false,"工序超时 · 重新取料");return;}
  if(state.view==="chop"&&keys.has("e"))cutOnce();
  if(state.view==="wok")cook(dt);
  if(state.view==="serve")balance(dt);
}
function input(k,down){
  if(!down){keys.delete(k);return;}
  if(k==="escape"){
    if(state.open==="pause")toggleMenu(null);
    else if(!state.open)toggleMenu("pause");
    return;
  }
  if(state.open||keys.has(k))return;
  keys.add(k);
  if(state.view==="map"&&k===" "){const o=nearStation();if(o)activate(o);else toast("靠近工作台后按空格");}
  if(state.view==="chop"&&k==="e")cutOnce();
  if(state.view==="wok"&&k==="f")flip();
}
window.addEventListener("keydown",e=>{
  if(["SELECT","INPUT"].includes(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k)&&!state.open)e.preventDefault();
  if(!e.repeat)input(k,true);
});
window.addEventListener("keyup",e=>input(e.key.toLowerCase(),false));
window.addEventListener("blur",()=>{if(!state.open)toggleMenu("pause");});
canvas.addEventListener("pointerdown",e=>{
  if(state.open)return;
  const box=canvas.getBoundingClientRect(),p={x:(e.clientX-box.left)*W/box.width,y:(e.clientY-box.top)*H/box.height,w:0,h:0};
  if(state.view==="map")target(activeStations().find(o=>hit(p,o))||p);
  else if(state.view==="chop")cutOnce();
});
function selectScene(scene){
  if(!state.open||state.open==="pause")return;
  if(scene==="fridge"){
    state.scene="fridge";dishes=fridgeDishes;
    const frost=get("frost-experience");
    if(frost.src==="about:blank")frost.src="frost-kitchen.html";
    frost.hidden=false;get("frost-back").hidden=false;canvas.hidden=true;menu.hidden=true;get("pause").hidden=true;get("controls").hidden=true;
    document.body.classList.toggle("fridge-scene",true);document.body.classList.toggle("toilet-scene",false);document.body.classList.toggle("coffee-scene",false);
    document.title="极限出餐｜冰封后厨";
    if(window.history?.replaceState)window.history.replaceState(null,"","?scene=fridge");
    return;
  }
  get("frost-experience").hidden=true;get("frost-back").hidden=true;canvas.hidden=false;menu.hidden=false;
  state.scene=["neon","fridge","toilet","coffee"].includes(scene)?scene:"neon";
  dishes={neon:officeDishes,fridge:fridgeDishes,toilet:toiletDishes,coffee:coffeeDishes}[state.scene];
  document.body.classList.toggle("toilet-scene",state.scene==="toilet");
  document.body.classList.toggle("fridge-scene",state.scene==="fridge");document.body.classList.toggle("coffee-scene",state.scene==="coffee");
  document.querySelector(".tag").textContent={neon:"⚡ OFFICE ARCADE / NEON KITCHEN",fridge:"FROZEN SHELF / ICE KITCHEN",toilet:"PORCELAIN BOWL / PIXEL KITCHEN",coffee:"BEAN HOPPER / MICRO KITCHEN"}[state.scene];
  document.title="极限出餐｜"+{neon:"赛博办公室",fridge:"冰箱内部",toilet:"冲水马桶内部",coffee:"咖啡机豆仓内部"}[state.scene];
  if(window.history?.replaceState)window.history.replaceState(null,"","?scene="+state.scene);
  for(const button of document.querySelectorAll("[data-scene]"))button.classList.toggle("selected",button.dataset.scene===state.scene);
  get("dish-select").replaceChildren();
  dishes.forEach((d,id)=>{const option=document.createElement("option");option.value=id;option.textContent=d.name;get("dish-select").append(option);});
  get("menu-hint").textContent=state.scene==="neon"?"WASD / 方向键移动 · Shift 快跑 · 空格操作 · Esc 暂停":"WASD 移动 · 空格取菜 · E 切菜/翻炒/端盘 · F 翻面";
  reset();toggleMenu("menu");
}
get("frost-back").onclick=()=>{state.open="menu";selectScene("neon");};
get("start").onclick=start;get("resume").onclick=()=>toggleMenu(null);get("pause").onclick=()=>toggleMenu("pause");
for(const button of document.querySelectorAll("[data-scene]"))button.onclick=()=>selectScene(button.dataset.scene);
for(const button of document.querySelectorAll("[data-mode]"))button.onclick=()=>practice(button.dataset.mode);
dishes.forEach((d,id)=>{const option=document.createElement("option");option.value=id;option.textContent=d.name;get("dish-select").append(option);});
const requestedScene=new URLSearchParams(window.location.search).get("scene");
selectScene(["neon","fridge","toilet","coffee"].includes(requestedScene)?requestedScene:"toilet");
function frameLoop(ms){
  const dt=lastFrame?clamp((ms-lastFrame)/1000,0,.04):0;lastFrame=ms;
  if(!state.open||state.open==="menu")now+=dt;
  advance(dt);
  if(state.view==="map")map(now);
  else {circuitry(now,true);trim(now);({chop:drawChop,wok:drawWok,serve:drawServe})[state.view](now);}
  visuals(now);
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
})();
</script>
