<body class="fridge-scene">
<main>
<canvas class="stage-ambience" width="80" height="45" aria-hidden="true"></canvas>
<div class="pocket-order"></div>
<button id="scene-back" type="button" style="position:absolute;left:1.2%;top:2%;z-index:5;padding:.4em .7em;font-size:1.1cqw">← 返回选厨房</button>
<div class="hardware-controls" id="hardware-controls"><button id="hardware-connect" type="button">连接 ESP</button><span id="hardware-status" role="status">键盘 / 触屏可用</span></div>
<div class="foot-controls" id="foot-controls" hidden><span id="foot-status" role="status">脚踝传感器未连接</span><span id="run-route" aria-live="polite"></span></div>
<canvas width="1280" height="720" id="game" tabindex="-1" aria-label="冰箱厨房游戏画面"></canvas>
<button class="pause" id="pause" aria-label="暂停" hidden>Ⅱ</button>
<button class="game-exit" id="game-exit" type="button" aria-label="退出到封面" hidden>退出</button>
<div class="touch" id="touch" hidden></div>
<div class="screen" id="screen">
<section class="panel" role="dialog" aria-labelledby="title">
<div class="kicker">❄ OFFICE ARCADE / FREEZER KITCHEN ❄</div>
<h1 id="title">冰封后厨</h1>
<p id="copy">选一道办公室冻品，切开、翻炒，再端过湿滑冰面。</p>
<div class="choices" id="choices" aria-label="选择关卡">
<button type="button" data-level="0">冰冻订书机</button>
<button type="button" data-level="1">冰冻老板</button>
<button type="button" data-level="2">冰冻文件夹</button>
<button type="button" data-level="3">冰冻打印机</button>
<button type="button" data-level="4">冰冻键盘</button>
<button type="button" data-level="5">冰冻空调</button>
</div>
<div class="actions" id="actions"></div>
<noscript><p>请用浏览器打开网页并启用 JavaScript。</p></noscript>
<p class="hint" id="hint">WASD / 方向键移动 · Shift 快跑 · 空格操作 · Esc 暂停</p>
</section>
</div>
<div class="sr" id="live" aria-live="polite"></div>
</main>

function project(x,y,a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1];
  const t=clamp(((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy),0,1);
  return [a[0]+t*dx,a[1]+t*dy];
}
function nearest(x,y){
  return walkways.map(([a,b])=>project(x,y,a,b)).reduce((best,p)=>Math.hypot(x-p[0],y-p[1])<Math.hypot(x-best[0],y-best[1])?p:best);
}
function route(destination){
  const origin=nearest(player.x,player.y);
  const [endX,endY]=nearest(destination.x,destination.y);
  const points=[...nodes,origin,[endX,endY]], cost=points.map(()=>Infinity), prev=points.map(()=>-1), visited=new Set();
  cost[nodes.length]=0;
  const allowed=(a,b)=>{
    if(a<nodes.length&&b<nodes.length)return links.some(([u,v])=>u===a&&v===b||u===b&&v===a);
    return walkways.some(([u,v])=>[points[a],points[b]].every(([x,y])=>{const p=project(x,y,u,v);return Math.hypot(p[0]-x,p[1]-y)<.5;}));
  };
  for(let i=0;i<points.length;i++){
    const a=cost.reduce((best,v,j)=>!visited.has(j)&&v<(best===-1?Infinity:cost[best])?j:best,-1);
    if(a<0)break;visited.add(a);
    for(let b=0;b<points.length;b++){
      if(visited.has(b)||!allowed(a,b))continue;
      const d=cost[a]+Math.hypot(points[a][0]-points[b][0],points[a][1]-points[b][1]);
      if(d<cost[b]){cost[b]=d;prev[b]=a;}
    }
  }
  const path=[];
  for(let i=points.length-1;i>=0;i=prev[i])path.unshift(points[i]);
  return path;
}
function activate(o){
  if(!o){say('靠近亮起的工作台后按空格');return;}
  if(o.step!==step){say('先完成：'+stageNames[step],C.gold);return;}
  if(step===0){window.KitchenAudio?.cue('pickup','fridge');step=1;burst(player.x,player.y-20);say('已领取冻品，前往分解砧板',C.gold,2);return;}
  window.KitchenAudio?.cue('station','fridge');
  enter(['','chop','wok','serve'][step]);
}
function closestStation(){
  const station=stations[step];
  return station&&Math.hypot(station.x-player.x,station.y-player.y)<=54?station:null;
}
function onLane(x,y){
  const [a,b]=nearest(x,y);
  return Math.hypot(a-x,b-y)<=walkRadius;
}
function move(dt){
  if(footEnabled){moveByRunning(dt);return;}
  let dx=Number(is('d','arrowright'))-Number(is('a','arrowleft')),dy=Number(is('s','arrowdown'))-Number(is('w','arrowup'));
  const manual=dx!==0||dy!==0;
  if(manual)target=null;
  const speed=(is('shift')?355:206)*dt;
  if(target){
    const [x,y]=target.path[0];dx=x-player.x;dy=y-player.y;
    if(Math.hypot(dx,dy)<=speed){
      player.x=x;player.y=y;target.path.shift();
      if(!target.path.length){const o=target.station;target=null;if(o)activate(o);}
      return;
    }
  }
  const length=Math.hypot(dx,dy);
  if(!length)return;
  const x=player.x+dx/length*speed,y=player.y+dy/length*speed;
  if(!manual){player.x=x;player.y=y;return;}
  if(onLane(x,y)){
    player.x=x;player.y=y;
  }else if(dx&&onLane(x,player.y)){
    player.x=x;
  }else if(dy&&onLane(player.x,y)){
    player.y=y;
  }
}
function planRunRoute(){
  const station=stations[step];if(!station)return;
  const path=route(station);
  if(!path.length)return;
  const points=[[player.x,player.y],...path];
  const distance=points.slice(1).reduce((sum,p,i)=>sum+Math.hypot(p[0]-points[i][0],p[1]-points[i][1]),0);
  target={station,path};runJourney={distance,traveled:0};
}
function moveByRunning(dt){
  if(!target)planRunRoute();
  if(!target)return;
  const journey=runJourney;
  $('run-route').textContent=`前往${target.station.label} · ${journey.distance?Math.min(99,Math.floor(journey.traveled/journey.distance*100)):100}% · ${footCycles} 次`;
  if(!target.path.length){const station=target.station;target=null;runJourney=null;clearRunInput();activate(station);return;}
  if(document.hidden||window.frameElement?.hidden||!footInput?.connected){clearRunInput();return;}
  let budget=Math.min(runBudget,206*dt);
  while(budget>0&&target.path.length){
    const [x,y]=target.path[0],dx=x-player.x,dy=y-player.y,d=Math.hypot(dx,dy);
    if(d<.01){target.path.shift();continue;}
    const amount=Math.min(budget,d);
    player.x+=dx/d*amount;player.y+=dy/d*amount;
    budget-=amount;runBudget=Math.max(0,runBudget-amount);journey.traveled+=amount;
    if(amount>=d-.001)target.path.shift();
  }
}

function spawnJet(p){

function balance(dt){
  const p=phase,active=is('e')&&p.progress<1;
  const plate=hardwareServeReady()?hardwareInput?.plate():null;
  const plateCorrection=plate?(Math.abs(plate.roll)<.08?0:Math.max(-1,Math.min(1,plate.roll*1.6))):null;
  const direction=plate?plateCorrection:Number(is('d','arrowright'))-Number(is('a','arrowleft'));
  p.kick=Math.max(0,p.kick-dt*2.9);p.jet+=dt;
  if(p.jet>=1.55){p.jet=0;spawnJet(p);}
  p.spray+=dt;
  if(p.spray>=.032){
    p.spray=0;
    for(const sign of [-1,1]){
      const force=sign===p.sign?p.kick:0;
      water.push({x:sign>0?322:958,y:453,vx:sign*(105+Math.random()*115+force*225),vy:-68-Math.random()*82-force*65,life:.38+Math.random()*.31,r:2+Math.random()*4,c:Math.random()<.4?'#efffff':'#51d7ff'});
    }
  }
  const slip=(Math.sin(now*5.4)*.56+Math.sin(now*2.5)*.51)+p.sign*(active?1.8:1.4)+p.sign*p.kick*2.35;
  p.velocity+=((plate?direction*8:direction*6.6)+slip-p.tilt*.74-p.velocity*2.8)*dt;
  p.tilt=clamp(p.tilt+p.velocity*dt,-balanceTrack.maxTilt,balanceTrack.maxTilt);
  if(Math.abs(p.tilt)>1.15)p.velocity*=.87;
  if(Math.abs(p.tilt)>.69)p.integrity=clamp(p.integrity-dt*(16+Math.abs(p.tilt)*15),0,100);
  if(p.integrity<=0){fail('盘子失衡，冻品全洒了');return;}
  if(active)p.progress=Math.min(1,p.progress+dt*(Math.abs(p.tilt)>.65?.084:.121));
  if(p.progress>=1)complete(p.integrity>=85?'EXCELLENT':'GOOD');
}
function tick(dt){

  }
  if(delay>0){delay-=dt;if(delay<=0)finishStep();return;}
  if(!practice){clock-=dt;if(clock<=0){fail('营业时间到，订单超时');return;}}
  if(scene==='map'){move(dt);return;}
  phase.left-=dt;
  if(phase.left<=0){fail('本步骤超时，请再挑战一次');return;}
  if(scene==='chop'){
    phase.beat=Math.max(0,phase.beat-dt);phase.swing=Math.max(0,phase.swing-dt*6.4);
    if(is('e'))cut();
  }
  if(scene==='wok')cook(dt);
  if(scene==='serve')balance(dt);
}
function input(k){
  if(k==='escape'){pause();return;}
  if(overlay||delay>0)return;
  if(footEnabled&&scene==='map'&&['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','shift',' '].includes(k))return;
  const first=!keys.has(k);keys.add(k);
  if(!first)return;
  if(scene==='map'&&k===' ')activate(closestStation());
  if(scene==='chop'&&k==='e')cut();
  if(scene==='wok'&&k==='f')flip();
}
const playableKeys=new Set(['w','a','s','d','shift','arrowup','arrowdown','arrowleft','arrowright',' ','e','f','escape']);
window.addEventListener('keydown',e=>{if(e.target?.id==='audio-toggle')return;const k=e.key.toLowerCase();if(!playableKeys.has(k)||overlay&&k!=='escape')return;e.preventDefault();if(k!=='escape'||!e.repeat)input(k);});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',clearKeys);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!overlay)pause();});
canvas.addEventListener('pointerdown',e=>{
  if(overlay||delay>0)return;
  const bounds=canvas.getBoundingClientRect();
  const x=(e.clientX-bounds.left)*W/bounds.width,y=(e.clientY-bounds.top)*H/bounds.height;
  if(scene==='map'){
    if(footEnabled)return;
    const station=stations.find(o=>Math.abs(o.x-x)<64&&y>=o.y-113&&y<=o.y+laneWidth/2);
    if(station&&station.step!==step){say('下一步：'+stageNames[step],C.gold);return;}
    if(!station&&!onLane(x,y))return;
    target={station,path:route(station||{x,y})};
  }else if(scene==='chop')cut();
});
$('pause').addEventListener('click',pause);
for(const [i,card] of Array.from($('choices').children).entries()){
  card.addEventListener('click',()=>{
    if(overlay!=='menu')return;
    selected=i;
    start();
  });
  card.prepend(menuIcon(i));
}
const updateViewport=window.KitchenViewport?.bind(canvas,()=>dishes[selected][0]+" · "+(stageNames[step]||"已交单"));
function frame(ms){
  const dt=last?Math.min((ms-last)/1000,.045):0;last=ms;
  if(!overlay||overlay==='menu')now+=dt;
  tick(dt);
  const urgent=!overlay&&!delay&&((!practice&&clock<24)||(phase?.left??Infinity)<5);
  const action=!overlay&&!delay&&((scene==='wok'&&(is('e')||(hardwareWokReady()&&hardwareInput?.stirring())))||
    (scene==='serve'&&phase.progress<1&&is('e')));
  window.KitchenAudio?.sync(!overlay||overlay==='menu'?'fridge':null,scene,Boolean(urgent),action);
  render();drawRunRoute();updateViewport?.(ms);requestAnimationFrame(frame);
}
if(footEnabled&&window.KitchenFoot){
  $('foot-controls').hidden=false;
  footInput=window.KitchenFoot.create({
    onCycle(packet){
      if(document.hidden||window.frameElement?.hidden||overlay||delay>0||scene!=='map'||practice)return false;
      if(!target)planRunRoute();if(!target)return false;
      footCycles+=packet.cycles;runBudget=Math.min(runBudget+packet.cycles*64,128);return true;
    },
    onLost:clearRunInput,
    onStatus(status){
      const labels={disabled:'脚踝小跑已关闭',connecting:'正在连接脚踝传感器…',connected:'脚踝已连接 · 原地小跑前进',running:'小跑周期已收到',retrying:'脚踝连接中断 · 正在重连',ambiguous:'发现多个脚部传感器',unsupported:'浏览器不支持脚部连接'};
      $('foot-status').textContent=labels[status];
    }
  });
  if(window.parent===window)footInput.connect();
  else{
    window.addEventListener('message',event=>{
      if(event.source!==window.parent||event.data?.type!=='kitchen-foot-relay')return;
      const origin=window.location.origin;
      if(event.origin!==origin&&!(window.location.protocol==='file:'&&event.origin==='null'))return;
      footInput.accept(event.data.packet);
    });
    const origin=window.location.origin;
    window.parent.postMessage({type:'frost-foot-ready'},origin==='null'?'*':origin);
  }
  window.addEventListener('pagehide',()=>footInput.disconnect());
}
if(window.parent!==window)$('hardware-controls').hidden=true;
if(window.KitchenHardware)hardwareInput=window.KitchenHardware.bind({
  button:$('hardware-connect'),status:$('hardware-status'),
  onChop(){
    if(!document.hidden&&!window.frameElement?.hidden&&!overlay&&scene==='chop'&&phase&&!delay)cut('hardware');
  },
  onStir(){return !!hardwareWokReady();},
  onFlip(){if(hardwareWokReady())flip();},
  onPlate(){return !!hardwareServeReady();}
});
const launchParams=new URLSearchParams(window.location.search);
if(window.parent===window){
  $('game-exit').hidden=false;
  $('game-exit').onclick=()=>{
    const entry=new URL('neon-chaos-kitchen.html',window.location.href);
    if(hardwareInput?.active)entry.searchParams.set('esp','1');
    window.location.replace(entry.href);
  };
}
$('scene-back').hidden=window.parent!==window;
$('scene-back').onclick=()=>{window.location.href='neon-chaos-kitchen.html?scene=fridge'+(launchParams.get('esp')==='1'?'&esp=1':'');};
if(launchParams.get('autostart')==='1'){
  const level=Number(launchParams.get('level'));selected=Number.isInteger(level)&&level>=0&&level<6?level:0;
  const practiceMode=launchParams.get('practice');
  start(['chop','wok','serve'].includes(practiceMode)?practiceMode:null,window.parent===window);
}else refreshMenu();
requestAnimationFrame(frame);

</script>
</body>
